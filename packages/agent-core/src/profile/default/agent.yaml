name: agent
description: Default Cloud Code agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - TaskList
  - TaskOutput
  - TaskStop
  - CronCreate
  - CronList
  - CronDelete
  - ReadMediaFile
  - TodoList
  - SaveMemory
  - Skill
  - WebSearch
  - Agent
  - AgentSwarm
  - TeamTaskCreate
  - TeamTaskList
  - TeamTaskUpdate
  - TeamTaskClaim
  - SendMessage
  - FetchURL
  - AskUserQuestion
  - EnterPlanMode
  - ExitPlanMode
  - EnterWorktree
  - ExitWorktree
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - mcp__*

subagents:
  coder:
    description: General software engineering agent — the only subagent type with file-editing tools; use it for any delegated task that must modify code.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior. For simple, directed searches (a specific file, class, or function) use Grep/Glob directly instead of delegating; reserve this agent for broader exploration that will clearly require more than 3 search queries.
  plan:
    description: Read-only implementation planning and architecture design.
