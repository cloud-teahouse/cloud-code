name: Feature Request
description: Suggest an idea or improvement for Cloud Code CLI
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What problem does this solve for you? Describe the workflow or
        situation where you hit the limitation.
      placeholder: e.g. When working in a monorepo, I can't ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What you'd like to see — a new command, a config option, changed
        behavior, etc. Sketches of UI or config shape are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you tried or thought about, and why they fall short.
    validations:
      required: false
