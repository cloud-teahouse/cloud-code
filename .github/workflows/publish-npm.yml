name: Publish to npm

on:

  # Both channels chain off the workflow that built their artifacts, so the
  # publish always lands after the assets it points at exist.
  #
  # `release: [published]` cannot be used for the tagged channel: the Release
  # workflow creates that release with the repository's own GITHUB_TOKEN, and
  # GitHub does not start a workflow run from an event raised that way (the
  # recursion guard). The event simply never arrives — so the Release run's
  # completion is what fires this instead.
  #
  # Branch filtering has to happen per job rather than here, since the Release
  # run is tagged rather than on a branch. Inert in the private repo, where
  # neither workflow publishes.
  workflow_run:
    workflows: ["CI", "Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel: release (dist-tag latest) or beta (dist-tag beta)"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
      tag:
        description: "Tag to publish (release channel only, e.g. v0.2.1)"
        required: false

env:
  CLOUD_CODE_SKIP_POSTINSTALL: "1" # our own postinstall would try to download a not-yet-published release

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

# Serialise publishes: queued runs keep FIFO order, so the beta dist-tag ends
# up on the newest main commit even when several CI runs finish close together.
concurrency:
  group: publish-npm
  cancel-in-progress: false

# Publishes the scoped package @cloud-teahouse/cloudcode-cli
# (apps/cloud-code). Authentication is npm Trusted Publishing (GitHub OIDC
# token exchange) — no NPM_TOKEN secret is used; the publisher entry is
# configured on npmjs.com for this repo + workflow file. Its postinstall
# script fetches the platform binary from the matching GitHub Release assets
# and verifies it against sha256sums.txt (see apps/cloud-code/npm/): a
# `vX.Y.Z` release for dist-tag latest, the rolling `beta` pre-release for
# dist-tag beta.
jobs:
  publish-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'release') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Release' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # head_sha rather than head_branch: for a tag-triggered run the
          # branch field is the tag name, and the sha is unambiguous either way.
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish @cloud-teahouse/cloudcode-cli
        working-directory: apps/cloud-code
        run: npm publish --provenance --access public

  # Beta npm builds run automatically after a successful CI run on main
  # (workflow_run above), or manually: Actions → "Publish to npm" → channel
  # `beta`. The version is `<package.json version>-beta.<short8>` so beta
  # installs never collide with tagged releases, and `--tag beta` keeps
  # `latest` untouched. workflow_run fires only after the whole CI run
  # completes, so the rolling `beta` pre-release the postinstall downloads
  # from already carries this exact commit's binaries.
  publish-beta:
    # The main-branch check used to live in the trigger's `branches:` filter;
    # it moved here when the Release workflow joined, and it still matters —
    # without it every pull-request CI run would publish a beta.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'beta') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Compute beta version
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          PKG_VERSION="$(node -p "require('./apps/cloud-code/package.json').version")"
          echo "BETA_VERSION=${PKG_VERSION}-beta.${SHA::8}" >> "$GITHUB_ENV"

      - name: Set the beta version on the package
        working-directory: apps/cloud-code
        run: npm version "$BETA_VERSION" --no-git-tag-version

      - name: Publish @cloud-teahouse/cloudcode-cli (beta)
        working-directory: apps/cloud-code
        run: npm publish --provenance --access public --tag beta
