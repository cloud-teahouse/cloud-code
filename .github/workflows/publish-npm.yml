name: Publish to npm

on:

  release:
    types: [published]
  # Auto-publish the beta dist-tag: the public repo's CI rebuilds the rolling
  # `beta` pre-release on every push to main, and its completion fires this.
  # Inert in the private repo (no main branch, so CI never runs there).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel: release (dist-tag latest) or beta (dist-tag beta)"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
      tag:
        description: "Tag to publish (release channel only, e.g. v0.2.1)"
        required: false

env:
  CLOUD_CODE_SKIP_POSTINSTALL: "1" # our own postinstall would try to download a not-yet-published release

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

# Serialise publishes: queued runs keep FIFO order, so the beta dist-tag ends
# up on the newest main commit even when several CI runs finish close together.
concurrency:
  group: publish-npm
  cancel-in-progress: false

# Publishes the scoped package @cloud-teahouse/cloudcode-cli
# (apps/cloud-code). Authentication is npm Trusted Publishing (GitHub OIDC
# token exchange) — no NPM_TOKEN secret is used; the publisher entry is
# configured on npmjs.com for this repo + workflow file. Its postinstall
# script fetches the platform binary from the matching GitHub Release assets
# and verifies it against sha256sums.txt (see apps/cloud-code/npm/): a
# `vX.Y.Z` release for dist-tag latest, the rolling `beta` pre-release for
# dist-tag beta.
jobs:
  publish-release:
    if: github.event_name == 'release' || inputs.channel == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish @cloud-teahouse/cloudcode-cli
        working-directory: apps/cloud-code
        run: npm publish --provenance --access public

  # Beta npm builds run automatically after a successful CI run on main
  # (workflow_run above), or manually: Actions → "Publish to npm" → channel
  # `beta`. The version is `<package.json version>-beta.<short8>` so beta
  # installs never collide with tagged releases, and `--tag beta` keeps
  # `latest` untouched. workflow_run fires only after the whole CI run
  # completes, so the rolling `beta` pre-release the postinstall downloads
  # from already carries this exact commit's binaries.
  publish-beta:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.channel == 'beta') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Compute beta version
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          PKG_VERSION="$(node -p "require('./apps/cloud-code/package.json').version")"
          echo "BETA_VERSION=${PKG_VERSION}-beta.${SHA::8}" >> "$GITHUB_ENV"

      - name: Set the beta version on the package
        working-directory: apps/cloud-code
        run: npm version "$BETA_VERSION" --no-git-tag-version

      - name: Publish @cloud-teahouse/cloudcode-cli (beta)
        working-directory: apps/cloud-code
        run: npm publish --provenance --access public --tag beta
